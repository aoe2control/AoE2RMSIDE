[workspace]
resolver = "3"
members = [
    "crates/rms-source",
    "crates/rms-syntax",
    "crates/rms-profile",
    "crates/rms-content",
    "crates/rms-semantics",
    "crates/rms-engine",
    "crates/rms-trace",
    "crates/rms-protocol",
    "crates/rms-analysis",
    "crates/rms-testkit",
    "crates/xs-syntax",
    "crates/xs-analysis",
    "bins/rmsd",
    "bins/rms-ls",
    "bins/rms-test",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/aoe2control/AoE2RMSIDE"

[workspace.dependencies]
anyhow = "=1.0.104"
bcdec_rs = { version = "=0.2.0", default-features = false }
clap = { version = "=4.6.6", features = ["derive"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
hex = "=0.4.3"
prost = "=0.14.4"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
starlark = "=0.14.2"
starlark_lsp = "=0.14.2"
windows-sys = "=0.61.2"

rms-source = { path = "crates/rms-source" }
rms-syntax = { path = "crates/rms-syntax" }
rms-profile = { path = "crates/rms-profile" }
rms-content = { path = "crates/rms-content" }
rms-semantics = { path = "crates/rms-semantics" }
rms-engine = { path = "crates/rms-engine" }
rms-trace = { path = "crates/rms-trace" }
rms-protocol = { path = "crates/rms-protocol" }
rms-analysis = { path = "crates/rms-analysis" }
rms-testkit = { path = "crates/rms-testkit" }
xs-syntax = { path = "crates/xs-syntax" }
xs-analysis = { path = "crates/xs-analysis" }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
